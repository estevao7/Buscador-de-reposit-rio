<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Repositórios no GitHub</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/script.js" defer></script>
</head>

<body>
  <main class="container">
    <h1>Buscador de Repositórios</h1>

    <section class="card search-card">
      <label for="search-input" class="search-label">Pesquisar repositórios</label>
      <input type="text" id="search-input" class="search-input" placeholder="Digite um termo e pressione Enter"
        autocomplete="off">
    </section>

    <section class="card results-card">
      <div id="results" class="results">
        <p class="hint">Digite um termo acima para buscar repositórios no GitHub.</p>
      </div>
    </section>
  </main>
</body>

</html>
